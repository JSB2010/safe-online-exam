x-app-base: &app-base
  image: ${APP_IMAGE:?Set APP_IMAGE to a versioned application image}
  env_file:
    - ${APP_ENV_FILE:-.env}
  environment:
    DATABASE_HOST: postgres
    DATABASE_PORT: "5432"
    SEB_CONFIG_ENCRYPTION_CERT_PATH: /run/secrets/seb_config_encryption_certificate
  secrets:
    - seb_config_encryption_certificate

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:?Set DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER:?Set DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    <<: *app-base
    command: ["dist/server/server/data/migrate.js"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app-base
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "/nodejs/bin/node",
          "-e",
          "fetch('http://127.0.0.1:8080/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 20
    restart: unless-stopped

  cleanup:
    <<: *app-base
    command: ["dist/server/server/data/cleanup.js", "--drain"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["maintenance"]
    restart: "no"

volumes:
  postgres_data:

secrets:
  seb_config_encryption_certificate:
    file: ${SECRETS_DIRECTORY:-./secrets}/seb-config-encryption.crt.pem

substitutions:
  _LOCATION: us-central1
  _REPOSITORY: canvas-seb-repo
  _IMAGE: canvas-seb-prod
  _CACHE_TAG: latest

steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "pull"
      - "${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:${_CACHE_TAG}"
    allowFailure: true

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID"
      - "-t"
      - "${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:${_CACHE_TAG}"
      - "--cache-from"
      - "${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:${_CACHE_TAG}"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    entrypoint: "/workspace/scripts/push-image-capture-digest.sh"
    args:
      - "${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID"
      - "/workspace/canvas-seb-prod.digest"

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:${_CACHE_TAG}"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "/workspace/scripts/deploy-cloud-run-digest.sh"
    args:
      - "${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}"
      - "/workspace/canvas-seb-prod.digest"
      - "canvas-seb-prod"
      - "--region=${_LOCATION}"
      - "--execution-environment=gen2"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--set-env-vars=NODE_ENV=production,APP_ENV=prod,APP_DEBUG_ENABLED=false,GCP_PROJECT_ID=$PROJECT_ID,FIRESTORE_DATABASE_ID=seb-canvaslti-prod"
      - "--set-secrets=CANVAS_DOMAIN=prod_canvas_domain:latest,LTI_CLIENT_ID=prod_lti_client_id:latest,LTI_DEPLOYMENT_ID=prod_lti_deployment_id:latest,TOOL_URL=prod_tool_url:latest,LTI_PRIVATE_KEY=prod_lti_private_key:latest,SESSION_SECRET=prod_session_secret:latest,STATE_ENCRYPTION_KEY=prod_state_encryption_key:latest,CANVAS_API_CLIENT_ID=prod_api_client_id:latest,CANVAS_API_CLIENT_SECRET=prod_api_client_secret:latest,SEB_CONFIG_ENCRYPTION_CERT_PEM=prod_seb_config_encryption_cert_pem:latest"
      - "--memory=2Gi"
      - "--cpu=2"
      - "--min-instances=1"
      - "--max-instances=10"
      - "--timeout=600s"
      - "--service-account=seb-canvas-prod@$PROJECT_ID.iam.gserviceaccount.com"

images:
  - "${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:$BUILD_ID"
  - "${_LOCATION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE}:${_CACHE_TAG}"

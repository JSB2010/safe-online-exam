# src/main/resources/application-dev.properties
spring.application.name=canvas-seb-integration

# Server configuration
server.port=8080

# Google Cloud Project ID (for Firestore)
spring.cloud.gcp.project-id=${GCP_PROJECT_ID}

# Firestore Database ID - explicitly set to use the dev database
firestore.database.id=seb-canvaslti-dev

# Firestore Collection Names
firestore.collection.quizzes=quizzes
firestore.collection.seb-settings=sebSettings
firestore.collection.seb-configs=sebConfigs


# LTI Configuration
lti.issuer=https://canvas.instructure.com
lti.clientId=${LTI_CLIENT_ID:lti-client-id-placeholder}
lti.keySetUrl=https://sso.canvaslms.com/api/lti/security/jwks
lti.tokenUrl=https://sso.canvaslms.com/login/oauth2/token
lti.authUrl=https://sso.canvaslms.com/api/lti/authorize_redirect
lti.toolUrl=${TOOL_URL:http://localhost:8080}
# Canvas API
canvas.api.baseUrl=https://kentdenver.instructure.com/api/v1

# SEB Configuration
seb.browserExamKeyRequired=true
seb.configKeyRequired=false

# Enhanced logging for troubleshooting
logging.level.org.springframework.web=DEBUG
logging.level.org.kentdenver.sebcanvas=DEBUG

# Include error details in responses
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# Timeout for Secret Manager operations (seconds)
secret-manager.client.timeout-seconds=6
# TTL for cached secrets (seconds)
secret-manager.cache.ttl-seconds=300
# Enable pre-fetching common secrets on startup
secret-manager.prefetch.enabled=true

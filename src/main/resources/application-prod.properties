# Production profile configuration

# Database Configuration for Google Cloud SQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql:///${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Google Cloud SQL properties
spring.datasource.hikari.data-source-properties.socketFactory=com.google.cloud.sql.postgres.SocketFactory
spring.datasource.hikari.data-source-properties.cloudSqlInstance=${CLOUD_SQL_CONNECTION_NAME}

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Disable H2 console in production
spring.h2.console.enabled=false

# Logging Configuration
logging.level.org.springframework=WARN
logging.level.org.kentdenver.sebcanvas=INFO
logging.level.org.hibernate.SQL=WARN

# LTI Configuration
lti.clientId=${LTI_CLIENT_ID}

# Security Configuration
spring.security.user.password=${ADMIN_PASSWORD}

# Server configuration
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=20
server.tomcat.max-connections=8192
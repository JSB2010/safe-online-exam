# Production profile configuration

# Google Cloud Project ID (for Firestore)
spring.cloud.gcp.project-id=${GCP_PROJECT_ID}

# Firestore Collection Names
firestore.collection.quizzes=quizzes-prod
firestore.collection.seb-settings=sebSettings-prod
firestore.collection.seb-configs=sebConfigs-prod

# Logging Configuration
logging.level.org.springframework=WARN
logging.level.org.kentdenver.sebcanvas=INFO

# LTI Configuration
lti.clientId=${LTI_CLIENT_ID}

# SEB Configuration
app.seb.required-url-filter-domains=du11hjcvx0uqb.cloudfront.net,accounts.google.com,login.google.com,oauth.google.com,googleapis.com,*.googleapis.com,apis.google.com,ssl.gstatic.com,www.gstatic.com,gstatic.com,*.gstatic.com,fonts.googleapis.com,fonts.gstatic.com,myaccount.google.com,security.google.com,www.google.com,google.com,ogs.google.com

# Debug Configuration (disabled in production)
app.debug.enabled=${DEBUG_MODE:false}

# Security Configuration
spring.security.user.password=${ADMIN_PASSWORD}

# Server configuration
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=20
server.tomcat.max-connections=8192

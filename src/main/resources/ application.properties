# Canvas SEB Integration Application Configuration
# ===============================================

# Application
spring.application.name=canvas-seb-integration
server.port=8080

# Active profile configuration
spring.profiles.active=dev

# Database configuration
spring.datasource.url=jdbc:h2:mem:sebdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging configuration
logging.level.org.springframework=INFO
logging.level.org.kentdenver.sebcanvas=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# LTI 1.3 Configuration for Canvas
# ===============================
# These values must match the Developer Key configuration in Canvas

# The issuer is always this value for Canvas regardless of domain
lti.issuer=https://canvas.instructure.com

# This is populated from an environment variable or use placeholder for dev
lti.clientId=${LTI_CLIENT_ID:lti-client-id-placeholder}

# URL to the Canvas LTI key set
# New domain as specified in Canvas documentation
lti.keySetUrl=https://sso.canvaslms.com/api/lti/security/jwks

# URL to the Canvas OAuth2 token endpoint
lti.tokenUrl=https://sso.canvaslms.com/login/oauth2/token

# URL to the Canvas OpenID Connect authorization endpoint
lti.authUrl=https://sso.canvaslms.com/api/lti/authorize_redirect

# The base URL of this tool
lti.toolUrl=${TOOL_URL:http://localhost:8080}

# Canvas API Configuration
# ======================
canvas.api.baseUrl=https://canvas.instructure.com/api/v1

# SEB Configuration
# ===============
seb.browserExamKeyRequired=true
seb.configKeyRequired=false

# Security Configuration
# ====================
spring.security.user.name=admin
spring.security.user.password=${ADMIN_PASSWORD:admin}

# Server compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Session configuration
server.servlet.session.timeout=30m
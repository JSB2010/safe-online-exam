# Canvas SEB Integration Application Configuration
# ===============================================

# Application
spring.application.name=canvas-seb-integration
server.port=8080

# Active profile configuration
spring.profiles.active=dev

# Logging configuration
logging.level.org.springframework=INFO
logging.level.org.kentdenver.sebcanvas=DEBUG

# LTI 1.3 Configuration for Canvas
# ===============================
# These values match the Canvas LTI 1.3 specification

# The issuer is always this value for Canvas regardless of domain
lti.issuer=https://canvas.instructure.com

# Key set URL - updated to use sso.canvaslms.com as per Canvas documentation
lti.keySetUrl=https://sso.canvaslms.com/api/lti/security/jwks

# URL to the Canvas OAuth2 token endpoint
lti.tokenUrl=https://sso.canvaslms.com/login/oauth2/token

# URL to the Canvas OpenID Connect authorization endpoint
lti.authUrl=https://sso.canvaslms.com/api/lti/authorize_redirect

# Canvas API Configuration
# ======================
canvas.api.baseUrl=https://canvas.instructure.com/api/v1

# SEB Configuration
# ===============
seb.browserExamKeyRequired=true
seb.configKeyRequired=false

# Google Cloud Configuration
# ========================
# spring.cloud.gcp.project-id is set via environment variable in production
# For local development with a service account key:
# spring.cloud.gcp.credentials.location=file:/path/to/service-account-key.json

# Security Configuration
# ====================
spring.security.user.name=admin
spring.security.user.password=${ADMIN_PASSWORD:admin}

# Server compression
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Session configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.path=/
server.servlet.session.cookie.max-age=1800
server.servlet.session.cookie.same-site=none
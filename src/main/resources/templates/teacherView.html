<!-- src/main/resources/templates/teacherView.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>SEB Quiz Configuration</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .table-container {
            margin-top: 20px;
        }
        .toggle-container {
            display: flex;
            align-items: center;
        }
        .form-switch {
            padding-left: 2.5em;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="mt-4 mb-4">Quiz Configuration for Safe Exam Browser</h1>

    <div class="alert alert-info">
        <strong>Instructions:</strong> Enable Safe Exam Browser for quizzes that need secure testing.
        Students will be required to use SEB to access these quizzes.
    </div>

    <div class="table-container">
        <table class="table table-striped">
            <thead>
            <tr>
                <th>Quiz Name</th>
                <th>Description</th>
                <th>Require SEB</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="quiz : ${quizzes}">
                <td th:text="${quiz.title}"></td>
                <td th:text="${quiz.description}"></td>
                <td>
                    <div class="toggle-container">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox"
                                   th:id="'sebToggle_' + ${quiz.id}"
                                   th:checked="${#vars['sebSetting_' + quiz.id] != null && #vars['sebSetting_' + quiz.id].sebRequired}"
                                   th:data-quiz-id="${quiz.id}">
                            <label class="form-check-label"
                                   th:for="'sebToggle_' + ${quiz.id}"
                                   th:text="${#vars['sebSetting_' + quiz.id] != null && #vars['sebSetting_' + quiz.id].sebRequired ? 'Enabled' : 'Disabled'}">
                            </label>
                        </div>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    $(document).ready(function() {
        // Handle SEB toggle changes
        $('.form-check-input').change(function() {
            const quizId = $(this).data('quiz-id');
            const isChecked = $(this).prop('checked');
            const label = $(this).next('label');

            // Update label text
            label.text(isChecked ? 'Enabled' : 'Disabled');

            // Send update to server
            $.ajax({
                url: '/teacher/updateSebSettings',
                type: 'POST',
                data: {
                    quizId: quizId,
                    sebRequired: isChecked
                },
                success: function(response) {
                    console.log('Settings updated:', response);
                },
                error: function(error) {
                    console.error('Error updating settings:', error);
                    // Revert the toggle if there was an error
                    $(this).prop('checked', !isChecked);
                    label.text(!isChecked ? 'Enabled' : 'Disabled');
                    alert('Failed to update settings. Please try again.');
                }
            });
        });
    });
</script>
</body>
</html>

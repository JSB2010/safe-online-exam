<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Canvas Quiz</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        #quiz-frame {
            width: 100%;
            height: 100vh;
            border: none;
        }
        .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }
        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="loader" id="loader">
    <div class="spinner"></div>
    <p>Loading quiz from Canvas...</p>
</div>

<iframe id="quiz-frame" th:src="${quizUrl}" style="display: none;"></iframe>

<script>
    // Hide loader and show iframe when content loads
    document.getElementById('quiz-frame').onload = function() {
        document.getElementById('loader').style.display = 'none';
        document.getElementById('quiz-frame').style.display = 'block';
    };
</script>
</body>
</html>

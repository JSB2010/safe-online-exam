steps:
  # Build the application
  - name: 'maven:3.8.6-openjdk-23'
    entrypoint: 'mvn'
    args: ['clean', 'package', '-DskipTests']

  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/canvas-seb-integration:$COMMIT_SHA', '.']

  # Push the Docker image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/canvas-seb-integration:$COMMIT_SHA']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'canvas-seb-integration'
      - '--image=gcr.io/$PROJECT_ID/canvas-seb-integration:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=SPRING_PROFILES_ACTIVE=prod,DB_USER=${_DB_USER},DB_PASS=${_DB_PASS},DB_NAME=${_DB_NAME},CLOUD_SQL_CONNECTION_NAME=${_CLOUD_SQL_CONNECTION_NAME},LTI_CLIENT_ID=${_LTI_CLIENT_ID},TOOL_URL=${_TOOL_URL}'

images:
  - 'gcr.io/$PROJECT_ID/canvas-seb-integration:$COMMIT_SHA'
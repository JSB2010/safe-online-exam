steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/canvas-seb:$COMMIT_SHA', '.']

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/canvas-seb:$COMMIT_SHA']

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'canvas-seb'
      - '--image'
      - 'gcr.io/$PROJECT_ID/canvas-seb:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'SPRING_PROFILES_ACTIVE=prod'
      - '--set-secrets'
      - 'DB_USER=db-user:latest,DB_PASS=db-pass:latest,DB_NAME=db-name:latest,CLOUD_SQL_CONNECTION_NAME=cloud-sql-conn:latest,LTI_CLIENT_ID=lti-client-id:latest'
      - '--add-cloudsql-instances'
      - '$PROJECT_ID:us-central1:canvas-seb-db'

images:
  - 'gcr.io/$PROJECT_ID/canvas-seb:$COMMIT_SHA'
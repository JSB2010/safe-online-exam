# Deploy a public GitHub Release image after it has passed the release workflow.
# This configuration deliberately does not build source or publish images.
substitutions:
  _IMAGE_REPOSITORY: ghcr.io/jsb2010/safe-online-exam
  _IMAGE_DIGEST: sha256:REPLACE_WITH_RELEASE_DIGEST
  _LOCATION: us-central1
  _SERVICE: canvas-seb-prod
  _APP_ENV: prod
  _CLOUD_SQL_INSTANCE: canvas-seb-prod
  _DATABASE_NAME: canvas_seb
  _DATABASE_USER: canvas_seb
  _DATABASE_POOL_MAX: "5"
  _SECRET_PREFIX: prod
  _SECRET_VERSION: "1"
  _DATABASE_PASSWORD_SECRET_VERSION: "1"
  _LTI_DEPLOYMENT_ID_CHECKING_ENABLED: "true"
  _SERVICE_ACCOUNT: seb-canvas-prod

steps:
  - name: "gcr.io/google.com/cloudsdktool/google-cloud-cli:stable"
    entrypoint: "/workspace/scripts/write-image-digest.sh"
    args:
      - "${_IMAGE_DIGEST}"
      - "/workspace/safe-online-exam-release.digest"

  - name: "gcr.io/google.com/cloudsdktool/google-cloud-cli:stable"
    entrypoint: "/workspace/scripts/deploy-cloud-run-digest.sh"
    args:
      - "${_IMAGE_REPOSITORY}"
      - "/workspace/safe-online-exam-release.digest"
      - "job"
      - "${_SERVICE}-migrate"
      - "--region=${_LOCATION}"
      - "--command=/nodejs/bin/node"
      - "--args=dist/server/server/data/migrate.js"
      - "--max-retries=0"
      - "--task-timeout=10m"
      - "--set-cloudsql-instances=$PROJECT_ID:${_LOCATION}:${_CLOUD_SQL_INSTANCE}"
      - "--set-env-vars=NODE_ENV=production,APP_ENV=${_APP_ENV},APP_DEBUG_ENABLED=false,APP_DETECTOR_DIAGNOSTICS_ENABLED=false,LTI_DEPLOYMENT_ID_CHECKING_ENABLED=${_LTI_DEPLOYMENT_ID_CHECKING_ENABLED},DATABASE_HOST=/cloudsql/$PROJECT_ID:${_LOCATION}:${_CLOUD_SQL_INSTANCE},DATABASE_PORT=5432,DATABASE_NAME=${_DATABASE_NAME},DATABASE_USER=${_DATABASE_USER},DATABASE_SSL_MODE=disable,DATABASE_POOL_MAX=${_DATABASE_POOL_MAX}"
      - "--set-secrets=CANVAS_DOMAIN=${_SECRET_PREFIX}_canvas_domain:${_SECRET_VERSION},LTI_CLIENT_ID=${_SECRET_PREFIX}_lti_client_id:${_SECRET_VERSION},LTI_DEPLOYMENT_ID=${_SECRET_PREFIX}_lti_deployment_id:${_SECRET_VERSION},TOOL_URL=${_SECRET_PREFIX}_tool_url:${_SECRET_VERSION},LTI_PRIVATE_KEY=${_SECRET_PREFIX}_lti_private_key:${_SECRET_VERSION},SESSION_SECRET=${_SECRET_PREFIX}_session_secret:${_SECRET_VERSION},STATE_ENCRYPTION_KEY=${_SECRET_PREFIX}_state_encryption_key:${_SECRET_VERSION},CANVAS_API_CLIENT_ID=${_SECRET_PREFIX}_api_client_id:${_SECRET_VERSION},CANVAS_API_CLIENT_SECRET=${_SECRET_PREFIX}_api_client_secret:${_SECRET_VERSION},SEB_CONFIG_ENCRYPTION_CERT_PEM=${_SECRET_PREFIX}_seb_config_encryption_cert_pem:${_SECRET_VERSION},DATABASE_PASSWORD=${_SECRET_PREFIX}_database_password:${_DATABASE_PASSWORD_SECRET_VERSION}"
      - "--service-account=${_SERVICE_ACCOUNT}@$PROJECT_ID.iam.gserviceaccount.com"

  - name: "gcr.io/google.com/cloudsdktool/google-cloud-cli:stable"
    entrypoint: "gcloud"
    args: ["run", "jobs", "execute", "${_SERVICE}-migrate", "--region=${_LOCATION}", "--wait"]

  - name: "gcr.io/google.com/cloudsdktool/google-cloud-cli:stable"
    entrypoint: "/workspace/scripts/deploy-cloud-run-digest.sh"
    args:
      - "${_IMAGE_REPOSITORY}"
      - "/workspace/safe-online-exam-release.digest"
      - "job"
      - "${_SERVICE}-cleanup"
      - "--region=${_LOCATION}"
      - "--command=/nodejs/bin/node"
      - "--args=dist/server/server/data/cleanup.js,--drain"
      - "--max-retries=1"
      - "--task-timeout=10m"
      - "--set-cloudsql-instances=$PROJECT_ID:${_LOCATION}:${_CLOUD_SQL_INSTANCE}"
      - "--set-env-vars=NODE_ENV=production,APP_ENV=${_APP_ENV},APP_DEBUG_ENABLED=false,APP_DETECTOR_DIAGNOSTICS_ENABLED=false,LTI_DEPLOYMENT_ID_CHECKING_ENABLED=${_LTI_DEPLOYMENT_ID_CHECKING_ENABLED},DATABASE_HOST=/cloudsql/$PROJECT_ID:${_LOCATION}:${_CLOUD_SQL_INSTANCE},DATABASE_PORT=5432,DATABASE_NAME=${_DATABASE_NAME},DATABASE_USER=${_DATABASE_USER},DATABASE_SSL_MODE=disable,DATABASE_POOL_MAX=${_DATABASE_POOL_MAX}"
      - "--set-secrets=CANVAS_DOMAIN=${_SECRET_PREFIX}_canvas_domain:${_SECRET_VERSION},LTI_CLIENT_ID=${_SECRET_PREFIX}_lti_client_id:${_SECRET_VERSION},LTI_DEPLOYMENT_ID=${_SECRET_PREFIX}_lti_deployment_id:${_SECRET_VERSION},TOOL_URL=${_SECRET_PREFIX}_tool_url:${_SECRET_VERSION},LTI_PRIVATE_KEY=${_SECRET_PREFIX}_lti_private_key:${_SECRET_VERSION},SESSION_SECRET=${_SECRET_PREFIX}_session_secret:${_SECRET_VERSION},STATE_ENCRYPTION_KEY=${_SECRET_PREFIX}_state_encryption_key:${_SECRET_VERSION},CANVAS_API_CLIENT_ID=${_SECRET_PREFIX}_api_client_id:${_SECRET_VERSION},CANVAS_API_CLIENT_SECRET=${_SECRET_PREFIX}_api_client_secret:${_SECRET_VERSION},SEB_CONFIG_ENCRYPTION_CERT_PEM=${_SECRET_PREFIX}_seb_config_encryption_cert_pem:${_SECRET_VERSION},DATABASE_PASSWORD=${_SECRET_PREFIX}_database_password:${_DATABASE_PASSWORD_SECRET_VERSION}"
      - "--service-account=${_SERVICE_ACCOUNT}@$PROJECT_ID.iam.gserviceaccount.com"

  - name: "gcr.io/google.com/cloudsdktool/google-cloud-cli:stable"
    entrypoint: "/workspace/scripts/deploy-cloud-run-digest.sh"
    args:
      - "${_IMAGE_REPOSITORY}"
      - "/workspace/safe-online-exam-release.digest"
      - "service"
      - "${_SERVICE}"
      - "--region=${_LOCATION}"
      - "--execution-environment=gen2"
      - "--platform=managed"
      - "--add-cloudsql-instances=$PROJECT_ID:${_LOCATION}:${_CLOUD_SQL_INSTANCE}"
      - "--set-env-vars=NODE_ENV=production,APP_ENV=${_APP_ENV},APP_DEBUG_ENABLED=false,APP_DETECTOR_DIAGNOSTICS_ENABLED=false,LTI_DEPLOYMENT_ID_CHECKING_ENABLED=${_LTI_DEPLOYMENT_ID_CHECKING_ENABLED},DATABASE_HOST=/cloudsql/$PROJECT_ID:${_LOCATION}:${_CLOUD_SQL_INSTANCE},DATABASE_PORT=5432,DATABASE_NAME=${_DATABASE_NAME},DATABASE_USER=${_DATABASE_USER},DATABASE_SSL_MODE=disable,DATABASE_POOL_MAX=${_DATABASE_POOL_MAX}"
      - "--set-secrets=CANVAS_DOMAIN=${_SECRET_PREFIX}_canvas_domain:${_SECRET_VERSION},LTI_CLIENT_ID=${_SECRET_PREFIX}_lti_client_id:${_SECRET_VERSION},LTI_DEPLOYMENT_ID=${_SECRET_PREFIX}_lti_deployment_id:${_SECRET_VERSION},TOOL_URL=${_SECRET_PREFIX}_tool_url:${_SECRET_VERSION},LTI_PRIVATE_KEY=${_SECRET_PREFIX}_lti_private_key:${_SECRET_VERSION},SESSION_SECRET=${_SECRET_PREFIX}_session_secret:${_SECRET_VERSION},STATE_ENCRYPTION_KEY=${_SECRET_PREFIX}_state_encryption_key:${_SECRET_VERSION},CANVAS_API_CLIENT_ID=${_SECRET_PREFIX}_api_client_id:${_SECRET_VERSION},CANVAS_API_CLIENT_SECRET=${_SECRET_PREFIX}_api_client_secret:${_SECRET_VERSION},SEB_CONFIG_ENCRYPTION_CERT_PEM=${_SECRET_PREFIX}_seb_config_encryption_cert_pem:${_SECRET_VERSION},DATABASE_PASSWORD=${_SECRET_PREFIX}_database_password:${_DATABASE_PASSWORD_SECRET_VERSION}"
      - "--memory=2Gi"
      - "--cpu=2"
      - "--min-instances=1"
      - "--max-instances=10"
      - "--timeout=600s"
      - "--service-account=${_SERVICE_ACCOUNT}@$PROJECT_ID.iam.gserviceaccount.com"

steps:
  # Build the application
  - name: 'maven:3.8.6-openjdk-23'
    entrypoint: 'mvn'
    args: ['clean', 'package', '-DskipTests']

  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/canvas-seb-repo/canvas-seb-dev:$COMMIT_SHA', '.']

  # Push the Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/canvas-seb-repo/canvas-seb-dev:$COMMIT_SHA']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'canvas-seb-dev'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/canvas-seb-repo/canvas-seb-dev:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--set-env-vars=SPRING_PROFILES_ACTIVE=dev,GCP_PROJECT_ID=$PROJECT_ID'
      - '--set-secrets=LTI_CLIENT_ID=dev_lti_client_id:latest,TOOL_URL=dev_tool_url:latest,ADMIN_PASSWORD=dev_admin_password:latest'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=2'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/canvas-seb-repo/canvas-seb-dev:$COMMIT_SHA'
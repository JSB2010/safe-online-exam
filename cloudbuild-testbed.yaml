substitutions:
  _SOURCE_COMMIT_SHA: REPLACE_WITH_FULL_GIT_SHA
  _SOURCE_REF: REPLACE_WITH_GIT_REF
  _SOURCE_WORKTREE_STATE: clean
  _SOURCE_DIFF_SHA: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
  _CREATE_BACKUP: "false"
  _LTI_COURSE_NAVIGATION_VISIBLE_TO_STUDENTS: "false"

steps:
  - name: "gcr.io/google.com/cloudsdktool/google-cloud-cli:stable@sha256:c458b41dcd5fa7fa66934a7ffe872b8a06e7134f51b01c007ed025858bc75b9c"
    entrypoint: "/workspace/scripts/validate-school-testbed-target.sh"
    args: ["$PROJECT_ID"]

  - name: "gcr.io/google.com/cloudsdktool/google-cloud-cli:stable@sha256:c458b41dcd5fa7fa66934a7ffe872b8a06e7134f51b01c007ed025858bc75b9c"
    entrypoint: "/workspace/scripts/validate-oauth-encryption-rollout.sh"
    args: ["$PROJECT_ID", "school-canvas-seb", "us-central1", "enforce"]

  - name: "gcr.io/cloud-builders/docker:latest@sha256:3d00b6c1a9b862621c30fc74d4f2abfc62bcbdee631ed3febd31e7edbdf6252c"
    args: ["pull", "us-central1-docker.pkg.dev/$PROJECT_ID/canvas-seb-repo/school-canvas-seb:cache"]
    allowFailure: true

  - name: "gcr.io/cloud-builders/docker:latest@sha256:3d00b6c1a9b862621c30fc74d4f2abfc62bcbdee631ed3febd31e7edbdf6252c"
    env: ["DOCKER_BUILDKIT=1"]
    args:
      - "build"
      - "--build-arg"
      - "BUILDKIT_INLINE_CACHE=1"
      - "--label"
      - "org.opencontainers.image.revision=${_SOURCE_COMMIT_SHA}"
      - "--label"
      - "org.opencontainers.image.ref.name=${_SOURCE_REF}"
      - "--label"
      - "com.safeonlineexam.cloud-build-id=$BUILD_ID"
      - "-t"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/canvas-seb-repo/school-canvas-seb:$BUILD_ID"
      - "-t"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/canvas-seb-repo/school-canvas-seb:cache"
      - "--cache-from"
      - "us-central1-docker.pkg.dev/$PROJECT_ID/canvas-seb-repo/school-canvas-seb:cache"
      - "."

  - name: "gcr.io/cloud-builders/docker:latest@sha256:3d00b6c1a9b862621c30fc74d4f2abfc62bcbdee631ed3febd31e7edbdf6252c"
    entrypoint: "/workspace/scripts/cloud-build-postgres-integration.sh"

  - name: "gcr.io/cloud-builders/docker:latest@sha256:3d00b6c1a9b862621c30fc74d4f2abfc62bcbdee631ed3febd31e7edbdf6252c"
    entrypoint: "/workspace/scripts/push-image-capture-digest.sh"
    args:
      - "us-central1-docker.pkg.dev/$PROJECT_ID/canvas-seb-repo/school-canvas-seb:$BUILD_ID"
      - "/workspace/school-canvas-testbed.digest"

  - name: "gcr.io/cloud-builders/docker:latest@sha256:3d00b6c1a9b862621c30fc74d4f2abfc62bcbdee631ed3febd31e7edbdf6252c"
    args: ["push", "us-central1-docker.pkg.dev/$PROJECT_ID/canvas-seb-repo/school-canvas-seb:cache"]

  - name: "gcr.io/google.com/cloudsdktool/google-cloud-cli:stable@sha256:c458b41dcd5fa7fa66934a7ffe872b8a06e7134f51b01c007ed025858bc75b9c"
    entrypoint: "/workspace/scripts/create-school-testbed-backup.sh"
    args: ["$PROJECT_ID", "${_CREATE_BACKUP}"]

  - name: "gcr.io/google.com/cloudsdktool/google-cloud-cli:stable@sha256:c458b41dcd5fa7fa66934a7ffe872b8a06e7134f51b01c007ed025858bc75b9c"
    entrypoint: "/workspace/scripts/deploy-school-testbed-runtime.sh"
    args:
      - "$PROJECT_ID"
      - "${_SOURCE_COMMIT_SHA}"
      - "${_SOURCE_REF}"
      - "${_SOURCE_WORKTREE_STATE}"
      - "${_SOURCE_DIFF_SHA}"
      - "$BUILD_ID"
      - "${_LTI_COURSE_NAVIGATION_VISIBLE_TO_STUDENTS}"

images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/canvas-seb-repo/school-canvas-seb:$BUILD_ID"
  - "us-central1-docker.pkg.dev/$PROJECT_ID/canvas-seb-repo/school-canvas-seb:cache"

tags:
  - "school-canvas-seb-testbed"

timeout: 3600s

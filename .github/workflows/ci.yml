name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Application verification
    needs: dependency-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Authenticate the pinned npm CLI
        run: |
          mkdir -p "$RUNNER_TEMP/corepack-shims"
          corepack enable npm --install-directory "$RUNNER_TEMP/corepack-shims"
          printf '%s\n' "$RUNNER_TEMP/corepack-shims" >>"$GITHUB_PATH"
          test "$("$RUNNER_TEMP/corepack-shims/npm" --version)" = "11.19.0"

      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Rebuild approved native dependencies
        run: npm run install:trusted

      - name: Run application verification
        run: npm run verify

  postgres:
    name: PostgreSQL integration
    needs: dependency-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Authenticate the pinned npm CLI
        run: |
          mkdir -p "$RUNNER_TEMP/corepack-shims"
          corepack enable npm --install-directory "$RUNNER_TEMP/corepack-shims"
          printf '%s\n' "$RUNNER_TEMP/corepack-shims" >>"$GITHUB_PATH"
          test "$("$RUNNER_TEMP/corepack-shims/npm" --version)" = "11.19.0"

      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Rebuild approved native dependencies
        run: npm run install:trusted

      - name: Run PostgreSQL integration tests
        run: npm run verify:postgres

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development
          license-check: true
          vulnerability-check: true
          show-openssf-scorecard: true
          show-patched-versions: true

  dependency-integrity:
    name: Dependency integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Authenticate the pinned npm CLI
        run: |
          mkdir -p "$RUNNER_TEMP/corepack-shims"
          corepack enable npm --install-directory "$RUNNER_TEMP/corepack-shims"
          printf '%s\n' "$RUNNER_TEMP/corepack-shims" >>"$GITHUB_PATH"
          test "$("$RUNNER_TEMP/corepack-shims/npm" --version)" = "11.19.0"

      - name: Verify dependency sources, integrity, versions, and lifecycle policy
        run: npm run verify:dependency-policy

      - name: Reject production vulnerability advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify registry signatures and provenance before executing the approved rebuild
        run: npm audit signatures

      - name: Rebuild and exercise only the approved native dependency
        run: npm run install:trusted

  compose:
    name: Production Compose smoke
    needs: dependency-integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build the production image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: safe-online-exam:compose-smoke
          cache-from: |
            type=gha,scope=compose
            type=registry,ref=ghcr.io/jsb2010/safe-online-exam:buildcache
          cache-to: type=gha,scope=compose,mode=max

      - name: Verify the production Compose topology
        env:
          COMPOSE_SMOKE_IMAGE: safe-online-exam:compose-smoke
          COMPOSE_SMOKE_SKIP_BUILD: "true"
        run: bash scripts/compose-smoke.sh

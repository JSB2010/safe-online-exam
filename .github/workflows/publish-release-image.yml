name: Publish release image

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: jsb2010/safe-online-exam

jobs:
  verify-release:
    name: Verify release source
    runs-on: ubuntu-24.04
    # The required-check waiter polls for up to 30 minutes. Leave enough
    # headroom for checkout, metadata validation, and GitHub API latency.
    timeout-minutes: 40
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      draft_exists: ${{ steps.release.outputs.draft_exists }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}
      verified_sha: ${{ steps.source.outputs.verified_sha }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tag is based on main
        id: source
        run: |
          verified_sha="$(git rev-parse HEAD)"
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$verified_sha" refs/remotes/origin/main
          printf 'verified_sha=%s\n' "$verified_sha" >>"$GITHUB_OUTPUT"

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/verify-release.mjs --tag "$RELEASE_TAG"

      - name: Inspect existing release state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          existing_release=""
          draft_exists=false
          if existing_release="$(
            gh release view "$RELEASE_TAG" \
              --json isDraft,isPrerelease 2>/dev/null
          )"; then
            if [[ "$(jq -r ".isDraft" <<<"$existing_release")" != "true" ]]; then
              echo "release $RELEASE_TAG is already published and cannot be replaced" >&2
              exit 1
            fi
            draft_exists=true
          fi

          version="${RELEASE_TAG#v}"
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true

          {
            printf 'tag=%s\n' "$RELEASE_TAG"
            printf 'version=%s\n' "$version"
            printf 'prerelease=%s\n' "$prerelease"
            printf 'draft_exists=%s\n' "$draft_exists"
          } >>"$GITHUB_OUTPUT"

      - name: Require successful main and CodeQL checks
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ steps.source.outputs.verified_sha }}
        run: bash scripts/wait-for-required-checks.sh "$VERIFIED_SHA"

  publish:
    name: Publish verified release
    needs: verify-release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      actions: read
      attestations: write
      checks: read
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Check out the verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release.outputs.verified_sha }}
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Generate verified release notes
        env:
          RELEASE_TAG: ${{ needs.verify-release.outputs.tag }}
        run: |
          mkdir -p release-artifacts
          node scripts/verify-release.mjs \
            --tag "$RELEASE_TAG" \
            --notes-output release-artifacts/release-notes.md

      - name: Create or refresh the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.verify-release.outputs.version }}
          PRERELEASE: ${{ needs.verify-release.outputs.prerelease }}
          DRAFT_EXISTS: ${{ needs.verify-release.outputs.draft_exists }}
        run: |
          common_arguments=(
            "$RELEASE_TAG"
            --title "Safe Online Exam $RELEASE_VERSION"
            --notes-file release-artifacts/release-notes.md
            --latest=false
          )

          if [[ "$DRAFT_EXISTS" == "true" ]]; then
            if [[ "$PRERELEASE" == "true" ]]; then
              gh release edit "${common_arguments[@]}" --draft=true --prerelease
            else
              gh release edit "${common_arguments[@]}" --draft=true --prerelease=false
            fi
          elif [[ "$PRERELEASE" == "true" ]]; then
            gh release create "${common_arguments[@]}" --verify-tag --draft --prerelease
          else
            gh release create "${common_arguments[@]}" --verify-tag --draft
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract final image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify-release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify-release.outputs.tag }},enable=${{ needs.verify-release.outputs.prerelease == 'false' }}
            type=semver,pattern={{major}},value=${{ needs.verify-release.outputs.tag }},enable=${{ needs.verify-release.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.verify-release.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0

      - name: Detect a recoverable promoted image
        id: existing-image
        env:
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          RELEASE_VERSION: ${{ needs.verify-release.outputs.version }}
          VERIFIED_SHA: ${{ needs.verify-release.outputs.verified_sha }}
        run: |
          if manifest="$(
            docker buildx imagetools inspect "$IMAGE_REPOSITORY:$RELEASE_VERSION" \
              --format '{{json .Manifest}}' 2>/dev/null
          )"; then
            digest="$(jq -r ".digest" <<<"$manifest")"
            bash scripts/verify-release-image.sh \
              "$IMAGE_REPOSITORY" "$digest" "$RELEASE_VERSION" "$VERIFIED_SHA" \
              "$RELEASE_VERSION"
            printf 'recover=true\n' >>"$GITHUB_OUTPUT"
            printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"
          else
            printf 'recover=false\n' >>"$GITHUB_OUTPUT"
          fi

      - name: Build and push the staged multi-architecture image
        if: steps.existing-image.outputs.recover != 'true'
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build-${{ needs.verify-release.outputs.verified_sha }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=compose
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Resolve the release image digest
        id: image
        env:
          EXISTING_DIGEST: ${{ steps.existing-image.outputs.digest }}
          PUBLISHED_DIGEST: ${{ steps.push.outputs.digest }}
          RECOVER: ${{ steps.existing-image.outputs.recover }}
        run: |
          if [[ "$RECOVER" == "true" ]]; then
            digest="$EXISTING_DIGEST"
          else
            digest="$PUBLISHED_DIGEST"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"

      - name: Report every high or critical finding in the exact staged image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          format: table
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Reject fixable high or critical findings in the exact staged image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Smoke the exact staged image and Compose topology
        env:
          COMPOSE_SMOKE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          COMPOSE_SMOKE_PORT: "18080"
          COMPOSE_SMOKE_PROJECT_NAME: safe-online-exam-release-${{ github.run_id }}
          COMPOSE_SMOKE_SKIP_BUILD: "true"
        run: bash scripts/compose-smoke.sh

      - name: Attest the verified image
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Build and upload the versioned deployment bundles
        id: bundles
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.verify-release.outputs.version }}
          RELEASE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          VERIFIED_SHA: ${{ needs.verify-release.outputs.verified_sha }}
        run: |
          compose_archive="$(
            bash scripts/create-release-bundle.sh \
              "$RELEASE_VERSION" "$RELEASE_IMAGE" release-artifacts
          )"
          cloud_run_archive="$(
            bash scripts/create-cloud-run-bundle.sh \
              "$RELEASE_VERSION" "$RELEASE_IMAGE" release-artifacts
          )"
          compose_checksum="$compose_archive.sha256"
          cloud_run_checksum="$cloud_run_archive.sha256"
          (
            cd "$(dirname "$compose_archive")"
            sha256sum "$(basename "$compose_archive")"
          ) >"$compose_checksum"
          (
            cd "$(dirname "$cloud_run_archive")"
            sha256sum "$(basename "$cloud_run_archive")"
          ) >"$cloud_run_checksum"

          bash scripts/render-release-deployment-notes.sh \
            "$RELEASE_VERSION" \
            "$RELEASE_IMAGE" \
            "$VERIFIED_SHA" \
            release-artifacts/release-notes.md

          gh release edit "$RELEASE_TAG" \
            --title "Safe Online Exam $RELEASE_VERSION" \
            --notes-file release-artifacts/release-notes.md \
            --draft=true
          gh release upload "$RELEASE_TAG" \
            "$compose_archive" \
            "$compose_checksum" \
            "$cloud_run_archive" \
            "$cloud_run_checksum" \
            --clobber

          {
            printf 'compose_archive=%s\n' "$compose_archive"
            printf 'compose_checksum=%s\n' "$compose_checksum"
            printf 'cloud_run_archive=%s\n' "$cloud_run_archive"
            printf 'cloud_run_checksum=%s\n' "$cloud_run_checksum"
          } >>"$GITHUB_OUTPUT"

      - name: Promote and verify immutable release tags
        env:
          FINAL_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_REPOSITORY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          RELEASE_VERSION: ${{ needs.verify-release.outputs.version }}
          VERIFIED_SHA: ${{ needs.verify-release.outputs.verified_sha }}
        run: |
          promotion=(docker buildx imagetools create)
          tag_names=()
          while IFS= read -r tag_reference; do
            [[ "$tag_reference" == "$IMAGE_REPOSITORY:"* ]]
            promotion+=(--tag "$tag_reference")
            tag_names+=("${tag_reference#"$IMAGE_REPOSITORY:"}")
          done <<<"$FINAL_TAGS"

          [[ ${#tag_names[@]} -gt 0 ]]
          "${promotion[@]}" "$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          bash scripts/verify-release-image.sh \
            "$IMAGE_REPOSITORY" "$IMAGE_DIGEST" "$RELEASE_VERSION" "$VERIFIED_SHA" \
            "${tag_names[@]}"

      - name: Verify image attestation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_IMAGE: oci://${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ needs.verify-release.outputs.tag }}
          VERIFIED_SHA: ${{ needs.verify-release.outputs.verified_sha }}
        run: |
          gh attestation verify "$RELEASE_IMAGE" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-release-image.yml" \
            --source-digest "$VERIFIED_SHA" \
            --source-ref "refs/tags/$RELEASE_TAG"

      - name: Publish the completed draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.verify-release.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.verify-release.outputs.tag }}
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi

          for _ in $(seq 1 10); do
            release="$(
              gh release view "$RELEASE_TAG" \
                --json isDraft,isImmutable,isPrerelease,url
            )"
            if [[ "$(jq -r ".isDraft" <<<"$release")" == "false" ]] &&
              [[ "$(jq -r ".isImmutable" <<<"$release")" == "true" ]]; then
              jq -r '"published immutable release: " + .url' <<<"$release"
              exit 0
            fi
            sleep 2
          done

          echo "release did not become published and immutable" >&2
          exit 1

      - name: Summarize the release
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_TAG: ${{ needs.verify-release.outputs.tag }}
        run: |
          {
            echo "## Published $RELEASE_TAG"
            echo
            echo "- Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@$IMAGE_DIGEST\`"
            echo "- Architectures: \`linux/amd64\`, \`linux/arm64\`"
            echo "- Assets: checksum-protected Compose and Cloud Run operator bundles"
            echo "- Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Preserve draft recovery instructions on failure
        if: failure()
        env:
          RELEASE_TAG: ${{ needs.verify-release.outputs.tag || github.ref_name }}
        run: |
          {
            echo "## Release did not publish"
            echo
            echo "The workflow leaves \`$RELEASE_TAG\` as a draft whenever possible."
            echo "Correct the failing gate and rerun this workflow; do not create a second release."
          } >>"$GITHUB_STEP_SUMMARY"

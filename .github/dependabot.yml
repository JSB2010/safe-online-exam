version: 2

# Keep ecosystems separate so an application-library update, runtime-image
# update, and CI-tooling update can be reviewed and rolled back independently.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Denver
    open-pull-requests-limit: 10
    rebase-strategy: auto
    versioning-strategy: increase-if-necessary
    labels: ["dependencies"]
    commit-message:
      prefix: deps
      prefix-development: deps-dev
      include: scope
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      nestjs:
        applies-to: version-updates
        patterns: ["@nestjs/*"]
      react:
        applies-to: version-updates
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      eslint:
        applies-to: version-updates
        patterns: ["eslint", "@eslint/*", "typescript-eslint"]
      vite:
        applies-to: version-updates
        patterns: ["vite", "@vitejs/*"]
      vitest:
        applies-to: version-updates
        patterns: ["vitest", "@vitest/*"]
      production-minor-and-patch:
        applies-to: version-updates
        dependency-type: production
        update-types: ["minor", "patch"]
        patterns: ["*"]
      development-minor-and-patch:
        applies-to: version-updates
        dependency-type: development
        update-types: ["minor", "patch"]
        patterns: ["*"]
    # Keep the compiler inside typescript-eslint's supported peer range, and
    # keep Node declarations aligned with the maintained Node 24 runtime.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: America/Denver
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels: ["dependencies", "github_actions"]
    commit-message:
      prefix: ci
      include: scope
    cooldown:
      default-days: 3
    groups:
      pinned-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: America/Denver
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 7
    groups:
      docker-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Node 24 is the supported runtime. A new Node major is an intentional
    # platform migration, not a routine dependency update.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: America/Denver
    open-pull-requests-limit: 5
    rebase-strategy: auto
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: build
      include: scope
    cooldown:
      default-days: 7
    groups:
      compose-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # PostgreSQL 17 is part of the maintained deployment contract. A database
    # major upgrade requires explicit migration and restore testing.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
